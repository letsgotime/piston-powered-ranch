      async function isStaff(db) {
        try {
          var s = await db.auth.getSession();
          var tok = s && s.data && s.data.session && s.data.session.access_token;
          if (!tok) return false;
          var r = await fetch(DATA_API + "/rpc/is_staff", {
            method: "POST",
            headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
            body: "{}",
          });
          if (!r.ok) return false;
          return (await r.text()).trim() === "true";
        } catch (e) { return false; }
      }
      var gate = document.getElementById("planningGate");
      var body = document.getElementById("planningBody");
      function deny(msg) {
        gate.innerHTML = '<h2>Staff only</h2><p>' + msg +
          ' <a href="/console/">Sign in at the console</a> on this device, then reload.</p>';
      }
      var db;
      try {
        db = makeDb();
      } catch (e) { deny("Could not reach the sign-in service."); }

      var esc = function (s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      };
      var money = function (c) { return "$" + Math.round(c / 100).toLocaleString("en-US"); };

      /* Budget rows, ported from the console. RLS is the real boundary; this
         display gate only decides whether to draw the page at all. */
      async function budgetRows() {
        var rows = document.getElementById("budgetRows");
        var total = document.getElementById("budgetHardTotal");
        if (!rows) return;
        var r;
        try {
          r = await db.from("budget_items").select("*").order("sort_order", { ascending: true });
        } catch (e) {
          rows.innerHTML = '<p class="note">Couldn\'t load the budget items: ' + esc(e.message) + ".</p>";
          return;
        }
        if (r.error) {
          rows.innerHTML = '<p class="note">Couldn\'t load the budget items: ' + esc(r.error.message) + ".</p>";
          return;
        }
        var items = r.data || [];
        if (!items.length) {
          rows.innerHTML = '<p class="note">No budget line items yet.</p>';
          if (total) total.textContent = "$0";
          return;
        }
        function recalc() {
          var sum = 0;
          rows.querySelectorAll(".qty-row").forEach(function (el) {
            var v = (parseFloat(el.getAttribute("data-rate-cents")) || 0) *
              Math.max(0, parseFloat(el.querySelector(".qty-input").value) || 0);
            el.querySelector(".qty-out").textContent = money(v);
            sum += v;
          });
          if (total) total.textContent = money(sum);
        }
        rows.innerHTML = items.map(function (it) {
          return '<div class="line-item qty-row" data-rate-cents="' + (it.rate_cents || 0) + '">' +
            '<span class="li-l">' + esc(it.label) +
            (it.detail ? "<small>" + esc(it.detail) + "</small>" : "") + "</span>" +
            '<span class="li-q"><input class="qty-input" type="number" min="0" step="1" value="' +
            (it.default_qty == null ? 1 : it.default_qty) + '" aria-label="Quantity for ' + esc(it.label) + '"></span>' +
            '<span class="li-v qty-out"></span></div>';
        }).join("");
        rows.addEventListener("input", function (e) { if (e.target.closest(".qty-input")) recalc(); });
        recalc();
      }

      (async function () {
        if (!db) return deny("Could not reach the sign-in service.");
        // Every await here could hang rather than fail. getSession resolving
        // never left the page on "Checking your session" indefinitely, which
        // reads as broken and gives nobody a way forward. Race it.
        var withTimeout = function (p, ms) {
          return Promise.race([p, new Promise(function (r) { setTimeout(function () { r(null); }, ms); })]);
        };
        var email = null;
        try {
          var s = await withTimeout(db.auth.getSession(), 8000);
          email = s && s.data && s.data.session && s.data.session.user && s.data.session.user.email;
        } catch (e) {}
        if (!email) return deny("You are not signed in.");
        if (!(await isStaff(db))) {
          return deny("The account " + esc(email) + " is not on the staff list.");
        }
        var token = null;
        try {
          var sess = await db.auth.getSession();
          token = sess && sess.data && sess.data.session && sess.data.session.access_token;
        } catch (e) {}
        if (!token) return deny("Could not read your session token.");

        var res;
        try {
          res = await fetch("/api/planning", { headers: { Authorization: "Bearer " + token } });
        } catch (e) {
          return deny("Could not reach the planning service.");
        }
        if (!res.ok) {
          var why = res.status === 403 ? "That account is not on the staff list." : "Your session was refused.";
          return deny(why);
        }
        var docs = await res.json();
        document.getElementById("planningDocs").innerHTML = docs.budget + docs.scope;

        gate.hidden = true;
        gate.style.display = "none";
        body.hidden = false;
        budgetRows();
      })();
    </script>
    <script type="module" src="/team/rail.js"></script>
</body>
</html>
