<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chat · The Piston Powered Ranch</title>
    <meta name="description" content="Team conversation, attached to the thing being discussed." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070d14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/rj-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/rj-icon-180.png" />
    <link rel="manifest" href="/chat/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ranch Chat" />
    <meta name="application-name" content="Ranch Chat" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&display=swap" />
    <style>
      :root {
        --bg: #070d14; --ink: #fff; --dim: #dbe2ea; --mute: #a9b4c2; --faint: #7f8a99;
        --amber: #f8b800; --teal: #00d2be; --blue: #3d8fd6; --crit: #FF1A21; --violet: #9b7fe0;
        --crit-fill: #E5141A;
        --glass: rgba(17, 27, 40, 0.6); --gline: rgba(255, 255, 255, 0.11);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --ease: cubic-bezier(0.16, 0.84, 0.32, 1);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--dim);
        font-family: Archivo, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden;
      }
      /* the dark horse in the stall, which sits behind a dark interface without fighting it. */
      .ground { position: fixed; inset: 0; z-index: 0; overflow: hidden; background-color: var(--bg); }
      /* A real element, not a CSS background: the preload scanner finds
         it in the markup and picks one width, where a background image
         waits for the stylesheet and a preload link fetched the wrong
         file alongside it. */
      .ground .shot { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block; }

      .ground i { position: absolute; display: block; border-radius: 50%; filter: blur(90px); }
      .ground i:nth-child(1) { width: 56vw; height: 56vw; left: -16vw; top: -22vw; background: radial-gradient(circle, #f8b800, transparent 68%); opacity: .14; }
      .ground i:nth-child(2) { width: 62vw; height: 62vw; right: -20vw; top: 26vh; background: radial-gradient(circle, #00d2be, transparent 68%); opacity: .14; }
      .ground i:nth-child(3) { width: 68vw; height: 68vw; left: 6vw; bottom: -34vw; background: radial-gradient(circle, #1f6ea8, transparent 70%); opacity: .14; }
      .ground u { position: absolute; inset: 0; display: block;
        background: linear-gradient(180deg, rgba(7,13,20,.74), rgba(7,13,20,.56) 34%, rgba(7,13,20,.9)); }
      .rule { position: relative; z-index: 4; height: 4px;
        background: linear-gradient(90deg, var(--amber) 0 25%, var(--teal) 25% 50%, #005185 50% 75%, var(--faint) 75% 100%); }

      .app { position: relative; z-index: 2; height: calc(100% - 4px); display: grid; grid-template-columns: 336px 1fr; gap: 12px;
        max-width: 1340px; margin: 0 auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
      .glass { background: var(--glass); border: 1px solid var(--gline); border-radius: 18px;
        box-shadow: 0 10px 34px rgba(0,0,0,.42);
        -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); }

      .side { display: flex; flex-direction: column; overflow: hidden; }
      .sideh { padding: 13px 15px 11px; border-bottom: 1px solid var(--gline); }
      .brandrow { display: flex; align-items: center; gap: 9px; }
      .brandrow img { height: 26px; }
      .brandrow b { font-size: 15px; font-weight: 900; color: var(--ink); letter-spacing: -.015em; }
      .brandrow .me { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; }
      .brandrow .me .d { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
      .brandrow .me.on { color: var(--teal); } .brandrow .me.on .d { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
      .find { margin-top: 10px; }
      .find input { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink);
        background: rgba(0,0,0,.3); border: 1px solid var(--gline); border-radius: 9px; padding: 8px 11px; }
      .find input:focus { outline: none; border-color: var(--amber); }
      .list { flex: 1; overflow-y: auto; padding: 8px; }
      .grp { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
        color: var(--faint); padding: 12px 8px 6px; font-weight: 600; }
      .grp.m { color: var(--amber); }
      .th { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 10px 11px; border-radius: 12px;
        cursor: pointer; border: 1px solid transparent; }
      .th:hover { background: rgba(255,255,255,.05); }
      .th.on { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
      .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--tone, var(--faint)); font-weight: 600; }
      .th .n { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; grid-column: 1;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .th .p { grid-column: 1 / -1; font-size: 12.5px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .th .b { grid-row: 2; grid-column: 2; justify-self: end; align-self: center; min-width: 20px; height: 20px; padding: 0 6px;
        border-radius: 999px; background: var(--teal); color: #04211d; font-size: 11px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
      .th .b.at { background: var(--amber); color: #2a1e00; }
      .th .t { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }

      .main { display: flex; flex-direction: column; overflow: hidden; }
      .mainh { padding: 13px 18px; border-bottom: 1px solid var(--gline); display: flex; align-items: center; gap: 12px; }
      .mainh .back { display: none; font: inherit; font-size: 19px; cursor: pointer; color: var(--dim);
        background: none; border: 0; padding: 0 2px; }
      .mainh h1 { margin: 0; font-size: 17px; font-weight: 900; color: var(--ink); letter-spacing: -.018em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mainh .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--tone, var(--faint)); font-weight: 600; }
      .mainh .go { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--dim); text-decoration: none;
        background: rgba(255,255,255,.06); border: 1px solid var(--gline); border-radius: 999px; padding: 7px 13px; white-space: nowrap; }
      .mainh .go:hover { border-color: var(--amber); color: var(--ink); }
      .feed { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 3px; }
      .day { align-self: center; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--faint); background: rgba(255,255,255,.05); border-radius: 999px; padding: 4px 12px; margin: 14px 0 8px; }
      .msg { max-width: min(680px, 84%); align-self: flex-start; }
      .msg.mine { align-self: flex-end; }
      .msg .who { font-size: 11.5px; font-weight: 700; color: var(--amber); margin: 9px 0 3px 3px; letter-spacing: .01em; }
      .msg.mine .who { display: none; }
      .msg .bub { padding: 9px 13px; border-radius: 15px 15px 15px 5px; background: rgba(255,255,255,.075);
        border: 1px solid var(--gline); font-size: 14.5px; line-height: 1.5; color: var(--dim); overflow-wrap: anywhere; }
      .msg.mine .bub { border-radius: 15px 15px 5px 15px; background: rgba(0,210,190,.13); border-color: rgba(0,210,190,.3); color: #eaf6f4; }
      .msg.run .bub { border-radius: 5px 15px 15px 5px; }
      .msg.mine.run .bub { border-radius: 15px 5px 5px 15px; }
      .msg .bub a { color: var(--teal); }
      .msg .bub .at { color: var(--amber); font-weight: 700; }
      .msg .bub .at.me { background: rgba(248,184,0,.18); border-radius: 4px; padding: 0 3px; }
      .msg .foot { display: flex; gap: 9px; align-items: center; margin: 3px 4px 0; font-family: var(--mono); font-size: 10px; color: var(--faint); }
      .msg.mine .foot { justify-content: flex-end; }
      .msg .foot button { font: inherit; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
        background: none; border: 0; color: var(--faint); cursor: pointer; padding: 0; }
      .msg .foot button:hover { color: var(--amber); }
      .msg .foot .del:hover { color: var(--crit); }
      .msg textarea { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: rgba(0,0,0,.3);
        border: 1px solid var(--amber); border-radius: 12px; padding: 9px 12px; resize: vertical; min-height: 62px; }

      .comp { border-top: 1px solid var(--gline); padding: 11px 14px calc(11px + env(safe-area-inset-bottom)); position: relative; }
      .comprow { display: grid; grid-template-columns: 1fr auto; gap: 9px; align-items: end; }
      .comp textarea { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: rgba(0,0,0,.32);
        border: 1px solid var(--gline); border-radius: 13px; padding: 11px 14px; resize: none; max-height: 168px; min-height: 44px; line-height: 1.45; }
      .comp textarea:focus { outline: none; border-color: var(--amber); }
      .comp .send { font: inherit; font-size: 13.5px; font-weight: 900; cursor: pointer; color: #04211d; background: var(--teal);
        border: 0; border-radius: 12px; padding: 12px 19px; height: 44px; }
      .comp .send:disabled { background: rgba(255,255,255,.08); color: var(--faint); cursor: default; }
      .comp .hint { margin-top: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .07em; color: var(--faint); }
      .comp .hint b { color: var(--crit); font-weight: 600; }
      .mentions { position: absolute; left: 14px; bottom: 100%; margin-bottom: 6px; z-index: 9; min-width: 232px;
        background: rgba(14,23,34,.97); border: 1px solid var(--gline); border-radius: 13px; overflow: hidden;
        box-shadow: 0 14px 34px rgba(0,0,0,.5); display: none; }
      .mentions.on { display: block; }
      .mentions div { padding: 9px 13px; font-size: 13.5px; cursor: pointer; color: var(--dim); }
      .mentions div small { display: block; font-family: var(--mono); font-size: 10px; color: var(--faint); }
      .mentions div.sel { background: rgba(248,184,0,.16); color: var(--ink); }

      /* ---------- attachments ---------- */
      .grid { display: grid; gap: 3px; margin-top: 6px; border-radius: 12px; overflow: hidden; }
      .grid.n1 { grid-template-columns: 1fr; }
      .grid.n2 { grid-template-columns: 1fr 1fr; }
      .grid.n3, .grid.n4 { grid-template-columns: 1fr 1fr; }
      .grid.many { grid-template-columns: repeat(3, 1fr); }
      .grid figure { position: relative; margin: 0; background: rgba(0,0,0,.35); cursor: pointer; overflow: hidden; }
      .grid.n1 figure { aspect-ratio: auto; max-height: 340px; }
      .grid:not(.n1) figure { aspect-ratio: 1; }
      .grid img, .grid video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .grid.n1 img, .grid.n1 video { max-height: 340px; object-fit: contain; background: #000; }
      .grid figure .more { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(4,8,13,.66); color: #fff; font-size: 19px; font-weight: 900; }
      .grid figure .play { position: absolute; inset: 0; margin: auto; width: 42px; height: 42px; border-radius: 50%;
        background: rgba(4,8,13,.62); border: 1px solid rgba(255,255,255,.4); pointer-events: none;
        display: flex; align-items: center; justify-content: center; }
      .grid figure .play::after { content: ""; border-left: 12px solid #fff; border-top: 8px solid transparent;
        border-bottom: 8px solid transparent; margin-left: 3px; }
      .doc { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 9px 12px; border-radius: 11px;
        background: rgba(0,0,0,.26); border: 1px solid var(--gline); text-decoration: none; color: var(--dim); }
      .doc:hover { border-color: var(--amber); }
      .doc .ext { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.08);
        display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px;
        font-weight: 700; letter-spacing: .04em; color: var(--amber); text-transform: uppercase; }
      .doc .nm { min-width: 0; font-size: 13.5px; font-weight: 700; color: var(--ink);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .doc .sz { font-family: var(--mono); font-size: 10px; color: var(--faint); }
      .voice { display: flex; align-items: center; gap: 11px; margin-top: 6px; padding: 9px 13px; border-radius: 999px;
        background: rgba(0,0,0,.26); border: 1px solid var(--gline); }
      .voice button { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        background: var(--teal); border: 0; color: #04211d; font-size: 13px; font-weight: 900; }
      .voice .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 24px; }
      .voice .wave i { flex: 1; background: rgba(255,255,255,.26); border-radius: 2px; min-height: 3px; }
      .voice .wave i.on { background: var(--teal); }
      .voice .len { font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

      /* ---------- lightbox ---------- */
      .lb { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(3,6,10,.93);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
      .lb.on { display: flex; flex-direction: column; }
      .lb .lbh { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: var(--dim); font-size: 13px; }
      .lb .lbh .sp { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb .lbh button, .lb .lbh a { font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
        color: var(--dim); background: rgba(255,255,255,.07); border: 1px solid var(--gline); border-radius: 999px; padding: 7px 14px; }
      .lb .lbb { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 20px; min-height: 0; }
      .lb img, .lb video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
      .lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
        cursor: pointer; background: rgba(17,27,40,.7); border: 1px solid var(--gline); color: #fff; font-size: 20px; }
      .lb .nav.p { left: 14px; } .lb .nav.n { right: 14px; }

      /* ---------- composer tray ---------- */
      .tray { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
      .chip { position: relative; width: 58px; height: 58px; border-radius: 11px; overflow: hidden;
        background: rgba(0,0,0,.35); border: 1px solid var(--gline); }
      .chip img, .chip video { width: 100%; height: 100%; object-fit: cover; }
      .chip .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 4px; font-family: var(--mono); font-size: 10px; text-align: center; color: var(--dim);
        text-transform: uppercase; letter-spacing: .05em; overflow: hidden; }
      .chip .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.14); }
      .chip .bar i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .2s linear; }
      .chip .kill { position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%;
        cursor: pointer; background: rgba(4,8,13,.8); border: 1px solid rgba(255,255,255,.28); color: #fff;
        font-size: 11px; line-height: 1; padding: 0; }
      .chip.bad { border-color: var(--crit-fill); }
      .tools { display: flex; gap: 6px; align-items: center; }
      .tools button { width: 40px; height: 40px; border-radius: 11px; cursor: pointer; font-size: 15px;
        color: var(--dim); background: rgba(255,255,255,.06); border: 1px solid var(--gline); padding: 0; }
      .tools button:hover { border-color: var(--amber); color: var(--ink); }
      .tools button.rec { background: var(--crit-fill); border-color: var(--crit-fill); color: #fff; }
      .comprow { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: end; }
      .reclive { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 13px;
        background: rgba(229, 20, 26,.12); border: 1px solid rgba(229, 20, 26,.4); }
      .reclive .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--crit-fill); }
      @media (prefers-reduced-motion: no-preference) { .reclive .dot { animation: pulse 1.1s ease-in-out infinite; } }
      @keyframes pulse { 50% { opacity: .25; } }
      .reclive .len { font-family: var(--mono); font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
      .reclive .sp { flex: 1; font-size: 12.5px; color: var(--mute); }
      .reclive button { font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 7px 14px;
        color: var(--dim); background: rgba(255,255,255,.07); border: 1px solid var(--gline); }
      .reclive button.keep { background: var(--teal); border-color: var(--teal); color: #04211d; font-weight: 900; }

      /* ---------- profile ---------- */
      .av { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
        background: rgba(255,255,255,.1); border: 1px solid var(--gline); }
      .avT { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 900;
        color: #04211d; background: var(--teal); }
      .msg .who { display: flex; align-items: center; gap: 7px; }
      .msg .who .av { width: 21px; height: 21px; font-size: 10px; }
      .brandrow .av { width: 26px; height: 26px; cursor: pointer; }
      .sheet { position: fixed; inset: 0; z-index: 50; display: none; }
      .sheet.on { display: block; }
      .sheet .scrim { position: absolute; inset: 0; background: rgba(4,8,13,.66);
        -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
      .sheet .card { position: absolute; right: 0; top: 0; bottom: 0; width: min(430px, 100%); overflow: auto;
        background: rgba(12,20,30,.95); border-left: 1px solid var(--gline);
        -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5);
        padding: 22px 22px calc(34px + env(safe-area-inset-bottom)); }
      .sheet .card h2 { margin: 4px 0 0; font-size: 21px; font-weight: 900; color: var(--ink); letter-spacing: -.02em; }
      .sheet .big { width: 84px; height: 84px; border-radius: 50%; font-size: 30px; }
      .sheet label { display: block; margin-top: 13px; font-family: var(--mono); font-size: 10px;
        letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
      .sheet input, .sheet textarea { width: 100%; margin-top: 5px; font: inherit; font-size: 14.5px; color: var(--ink);
        background: rgba(0,0,0,.3); border: 1px solid var(--gline); border-radius: 10px; padding: 9px 12px; }
      .sheet input:focus, .sheet textarea:focus { outline: none; border-color: var(--amber); }
      .sheet input[readonly] { color: var(--faint); }
      .sheet .row { display: flex; gap: 13px; align-items: center; }
      .sheet .pick { font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--dim);
        background: rgba(255,255,255,.06); border: 1px solid var(--gline); border-radius: 999px; padding: 8px 15px; }
      .sheet .save { margin-top: 17px; width: 100%; font: inherit; font-size: 14px; font-weight: 900; cursor: pointer;
        color: #04211d; background: var(--teal); border: 0; border-radius: 12px; padding: 12px; }
      .sheet .x { position: absolute; right: 15px; top: 14px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        border: 1px solid var(--gline); background: rgba(255,255,255,.06); color: var(--dim); font: inherit; font-size: 16px; }
      .sheet .mine { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--gline); }
      .sheet .mine h3 { margin: 0 0 9px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--faint); font-weight: 600; }
      .sheet .mine .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
      .sheet .mine .g figure { margin: 0; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.3); cursor: pointer; }
      .sheet .mine .g img { width: 100%; height: 100%; object-fit: cover; }

      .blank { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 30px; text-align: center; }
      .blank b { font-size: 19px; font-weight: 900; color: var(--ink); }
      .blank p { margin: 0; font-size: 14px; color: var(--mute); max-width: 44ch; }
      .lock { padding: 26px; font-size: 15px; } .lock a { color: var(--amber); }

      /* Installed to a home screen the app owns the whole screen, so it takes
         the notch itself rather than letting the browser pad around it. */
      @media (display-mode: standalone), (display-mode: window-controls-overlay) {
        .rule { padding-top: env(safe-area-inset-top); box-sizing: content-box; }
        .app { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
        body { overscroll-behavior: none; }
        .th, .msg, .send { -webkit-user-select: none; user-select: none; }

    <script type="module">
      import { db as makeDb, DATA_API, EVENT_ID } from "/vendor/ranch-db.js?v=2026-09-02f";
      import { upload as blobUpload } from "/vendor/vercel-blob-client.js";

      
      /* label, tone, and where the record itself lives */
      var KINDS = {
        team: ["Team", "var(--teal)", null],
        category: ["Category", "var(--amber)", "/targets/"],
        candidate: ["Prospect", "var(--amber)", "/targets/"],
        account: ["Account", "var(--blue)", "/board/"],
        decision: ["Decision", "var(--crit)", "/journeys/#p=decisions"],
        budget: ["Budget line", "var(--violet)", "/console/planning/"],
        milestone: ["Milestone", "var(--blue)", "/journeys/#p=timeline"],
        workbench: ["Working board", "var(--amber)", "/asks/"],
        submission: ["Submission", "var(--teal)", "/console/#ops"],
      };

      /* Gavin: fifty photos, five minutes of video, five minutes of voice, any
         document. Duration is checked here because the upload endpoint can only
         see bytes; bytes are capped there as the backstop. */
      var LIMITS = { photo: 50, videoSec: 300, voiceSec: 300 };

      if (location.search.indexOf("embed=1") > -1 || window.self !== window.top) {
        document.body.classList.add("embed");
      }

      var db = null, staff = false, ME = "", NAMES = {}, ROSTER = [], PEOPLE = {}, MY = null;
      var ATT = {}, SIGNED = {}, PEND = [], LB = [], lbAt = 0;
      var rec = null, recChunks = [], recStart = 0, recTimer = null;
      var THREADS = [], UNREAD = {}, MSGS = [], openId = null, editing = null;
      var mentionOpen = false, mentionPick = 0, mentionHits = [], mentionAt = -1;
      var lastCount = 0, stickBottom = true;

      try {
        db = makeDb();
      } catch (e) {}

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function nameOf(email) {
        if (!email) return "someone";
        var k = String(email).toLowerCase();
        return NAMES[k] || k.split("@")[0];
      }
      function first(email) { return nameOf(email).split(" ")[0]; }
      function initials(name) {
        return String(name || "?").trim().split(/\s+/).slice(0, 2)
          .map(function (w) { return w[0]; }).join("").toUpperCase();
      }
      /* A picture when they have set one, their initials when they have not.
         Never a blank circle, which reads as a broken image. */
      function avatar(email, cls) {
        var p2 = PEOPLE[String(email || "").toLowerCase()];
        var n = (p2 && p2.full_name) || nameOf(email);
        if (p2 && p2.avatar_path) {
          return '<img class="av ' + (cls || "") + '" data-path="' + esc(p2.avatar_path) +
            '" alt="' + esc(n) + '" title="' + esc(n) + '" />';
        }
        return '<span class="av avT ' + (cls || "") + '" title="' + esc(n) + '">' + esc(initials(n)) + "</span>";
      }
      async function token() {
        var s = await db.auth.getSession();
        return (s && s.data && s.data.session && s.data.session.access_token) || null;
      }
      async function rpc(fn, body) {
        var tok = await token();
        if (!tok) return null;
        var r = await fetch(DATA_API + "/rpc/" + fn, {
          method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
          body: JSON.stringify(body || {}) });
        if (!r.ok) return null;
        var t = await r.text();
        try { return JSON.parse(t); } catch (e) { return t.trim(); }
      }

      /* ---------- media plumbing ---------- */
      var KIND_OF = { image: "photo", video: "video", audio: "voice" };
      function kindOf(f) { return KIND_OF[String(f.type).split("/")[0]] || "doc"; }
      function size(b) {
        if (!b) return "";
        if (b < 1024) return b + " B";
        if (b < 1048576) return Math.round(b / 1024) + " KB";
        return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + " MB";
      }
      function ext(name) { var m = /\.([a-z0-9]{1,5})$/i.exec(name || ""); return m ? m[1] : "file"; }
      function clock(ms) {
        var t = Math.max(0, Math.round((ms || 0) / 1000));
        return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
      }
      /* Reads how long a clip is by letting the browser decode its header. The
         upload endpoint only sees bytes, so this is where five minutes is
         actually enforced. */
      function duration(file) {
        return new Promise(function (done) {
          var el = document.createElement(file.type.indexOf("video") === 0 ? "video" : "audio");
          var url = URL.createObjectURL(file);
          var give = setTimeout(function () { URL.revokeObjectURL(url); done(null); }, 7000);
          el.preload = "metadata";
          el.onloadedmetadata = function () {
            clearTimeout(give);
            var d = isFinite(el.duration) ? el.duration : null;
            URL.revokeObjectURL(url);
            done(d);
          };
          el.onerror = function () { clearTimeout(give); URL.revokeObjectURL(url); done(null); };
          el.src = url;
        });
      }
      async function signPaths(paths) {
        var tok = await token();
        var want = paths.filter(function (p2) {
          var hit = SIGNED[p2];
          return !hit || hit.exp < Date.now() + 3e4;
        });
        if (!tok || !want.length) return;
        for (var i = 0; i < want.length; i += 100) {
          var slice = want.slice(i, i + 100);
          try {
            var r = await fetch("/api/media", {
              method: "POST",
              headers: { "content-type": "application/json", authorization: "Bearer " + tok },
              body: JSON.stringify({ pathnames: slice }),
            });
            if (!r.ok) continue;
            var j = await r.json();
            (j.urls || []).forEach(function (u) {
              if (u.url) SIGNED[u.pathname] = { url: u.url, exp: j.expiresAt || Date.now() + 6e5 };
            });
          } catch (e) {}
        }
      }
      /* Signed links are ten minutes long, so the src is filled in after paint
         rather than baked into the markup, and refreshed when it lapses. */
      async function fillMedia(root) {
        var els = [].slice.call((root || document).querySelectorAll("[data-path]"));
        if (!els.length) return;
        await signPaths(els.map(function (e2) { return e2.getAttribute("data-path"); }));
        els.forEach(function (e2) {
          var hit = SIGNED[e2.getAttribute("data-path")];
          if (!hit) return;
          if (e2.tagName === "A") e2.href = hit.url;
          else if (!e2.src) e2.src = hit.url;
        });
      }

      function when(iso) {
        var d = new Date(iso), n = new Date();
        var same = d.toDateString() === n.toDateString();
        if (same) return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        var y = new Date(n); y.setDate(y.getDate() - 1);
        if (d.toDateString() === y.toDateString()) return "Yesterday";
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      }
      function dayLabel(iso) {
        var d = new Date(iso), n = new Date();
        if (d.toDateString() === n.toDateString()) return "Today";
        var y = new Date(n); y.setDate(y.getDate() - 1);
        if (d.toDateString() === y.toDateString()) return "Yesterday";
        return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
      }
      /* escape first, then decorate. Never the other way round. */
      function body(text, mentions) {
        var out = esc(text);
        out = out.replace(/\b(https?:\/\/[^\s<]+)/g, function (u) {
          return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>";
        });
        (mentions || []).forEach(function (em) {
          var n = nameOf(em), mine = String(em).toLowerCase() === ME.toLowerCase();
          out = out.split("@" + n).join('<span class="at' + (mine ? " me" : "") + '">@' + esc(n) + "</span>");
        });
        return out.replace(/\n/g, "<br />");
      }

      function media(mid) {
        var set = (ATT[mid] || []).slice().sort(function (a, b) { return a.sort - b.sort; });
        if (!set.length) return "";
        var shots = set.filter(function (a) { return a.kind === "photo" || a.kind === "video"; });
        var voices = set.filter(function (a) { return a.kind === "voice"; });
        var docs = set.filter(function (a) { return a.kind === "doc"; });
        var out = "";

        if (shots.length) {
          var show = shots.slice(0, 9), extra = shots.length - show.length;
          var cls = shots.length === 1 ? "n1" : shots.length === 2 ? "n2"
            : shots.length <= 4 ? "n" + shots.length : "many";
          out += '<div class="grid ' + cls + '">' + show.map(function (a, i) {
            var last = extra > 0 && i === show.length - 1;
            return '<figure data-lb="' + a.id + '">' +
              (a.kind === "video"
                ? '<video data-path="' + esc(a.path) + '" preload="metadata" muted playsinline></video><span class="play"></span>'
                : '<img data-path="' + esc(a.path) + '" alt="' + esc(a.filename || "") + '" loading="lazy" />') +
              (last ? '<span class="more">+' + (extra + 1) + "</span>" : "") + "</figure>";
          }).join("") + "</div>";
        }
        voices.forEach(function (a) {
          out += '<div class="voice"><button type="button" data-play="' + a.id + '">&#9654;</button>' +
            '<span class="wave">' + Array.from({ length: 26 }, function (_, i) {
              /* A real waveform needs the samples decoded, which is a lot of
                 work for decoration. This is a fixed shape, and the length
                 beside it is the number that is actually true. */
              var h = 26 + ((i * 37) % 60);
              return '<i style="height:' + h + '%"></i>';
            }).join("") + "</span>" +
            '<span class="len">' + (a.duration_ms ? clock(a.duration_ms) : size(a.bytes)) + "</span></div>";
        });
        docs.forEach(function (a) {
          out += '<a class="doc" data-path="' + esc(a.path) + '" target="_blank" rel="noopener" download="' +
            esc(a.filename || "file") + '"><span class="ext">' + esc(ext(a.filename)) + "</span>" +
            '<span style="min-width:0"><span class="nm">' + esc(a.filename || "Document") + "</span>" +
            '<span class="sz">' + esc(size(a.bytes)) + "</span></span></a>";
        });
        return out;
      }

      function paintList() {
        var q = (document.getElementById("find").value || "").toLowerCase().trim();
        var set = THREADS.filter(function (t) {
          if (!q) return true;
          return (t.title + " " + (t.last_preview || "") + " " + (KINDS[t.subject_kind] || [""])[0]).toLowerCase().indexOf(q) > -1;
        });
        var men = set.filter(function (t) { var u = UNREAD[t.id]; return u && u.mentioned; });
        var un = set.filter(function (t) { var u = UNREAD[t.id]; return u && u.unread > 0 && !u.mentioned; });
        var rest = set.filter(function (t) { var u = UNREAD[t.id]; return !u || !u.unread; });

        function row(t) {
          var k = KINDS[t.subject_kind] || ["Thread", "var(--faint)", null];
          var u = UNREAD[t.id] || { unread: 0 };
          return '<div class="th' + (String(t.id) === String(openId) ? " on" : "") + '" data-t="' + t.id + '" style="--tone:' + k[1] + '">' +
            '<span class="k">' + esc(k[0]) + "</span>" +
            '<span class="t">' + (t.message_count ? esc(when(t.last_at)) : "") + "</span>" +
            '<span class="n">' + esc(t.title) + "</span>" +
            (u.unread ? '<span class="b' + (u.mentioned ? " at" : "") + '">' + (u.mentioned ? "@" : u.unread) + "</span>" : "") +
            '<span class="p">' + (t.last_preview
              ? esc(first(t.last_by)) + ": " + esc(t.last_preview)
              : "<em style='color:var(--faint)'>nothing said yet</em>") + "</span></div>";
        }
        document.getElementById("list").innerHTML =
          (men.length ? '<div class="grp m">You were named</div>' + men.map(row).join("") : "") +
          (un.length ? '<div class="grp">Unread</div>' + un.map(row).join("") : "") +
          (rest.length ? '<div class="grp">' + (men.length || un.length ? "Everything else" : "Conversations") + "</div>" + rest.map(row).join("") : "") +
          (set.length ? "" : '<p style="padding:14px;color:var(--mute);font-size:14px">Nothing matches that.</p>');

        var tot = Object.keys(UNREAD).reduce(function (n, k) { return n + (UNREAD[k].unread || 0); }, 0);
        document.title = (tot ? "(" + tot + ") " : "") + "Chat · The Piston Powered Ranch";
        badge(tot);
      }

      function paintFeed() {
        var feed = document.getElementById("feed");
        var t = THREADS.filter(function (x) { return String(x.id) === String(openId); })[0];
        document.getElementById("comp").style.display = t ? "" : "none";
        if (!t) {
          feed.innerHTML = '<div class="blank"><b>Pick a conversation</b>' +
            "<p>Every thread here hangs off something real: a category, a prospect, a decision. " +
            "That way the talk and the record are the same thing, and nobody has to scroll back through a week to find what was agreed.</p></div>";
          document.getElementById("hT").textContent = "Chat";
          document.getElementById("hK").textContent = "";
          document.getElementById("hGo").style.display = "none";
          return;
        }
        var k = KINDS[t.subject_kind] || ["Thread", "var(--faint)", null];
        document.querySelector(".mainh > div").style.setProperty("--tone", k[1]);
        document.getElementById("hK").textContent = k[0];
        document.getElementById("hT").textContent = t.title;
        var go = document.getElementById("hGo");
        if (k[2]) { go.href = k[2]; go.style.display = ""; } else go.style.display = "none";

        if (!MSGS.length) {
          feed.innerHTML = '<div class="blank"><b>' + esc(t.title) + "</b><p>No messages yet. Say the first thing.</p></div>";
          return;
        }
        var html = "", lastDay = "", prevAuthor = "", prevAt = 0;
        MSGS.forEach(function (m) {
          var d = dayLabel(m.created_at);
          if (d !== lastDay) { html += '<div class="day">' + esc(d) + "</div>"; lastDay = d; prevAuthor = ""; }
          var mine = String(m.author).toLowerCase() === ME.toLowerCase();
          var gap = new Date(m.created_at) - prevAt;
          var run = m.author === prevAuthor && gap < 6e5;
          html += '<div class="msg' + (mine ? " mine" : "") + (run ? " run" : "") + '" data-m="' + m.id + '">' +
            (run ? "" : '<div class="who">' + avatar(m.author) + esc(nameOf(m.author)) + "</div>") +
            (String(editing) === String(m.id)
              ? '<textarea data-edit="' + m.id + '">' + esc(m.body) + "</textarea>" +
                '<div class="foot"><button data-savep="' + m.id + '">Save</button><button data-cancel="1">Cancel</button></div>'
              : '<div class="bub">' + (m.body === "\u200b" ? "" : body(m.body, m.mentions)) + media(m.id) + "</div>" +
                '<div class="foot"><span>' + esc(when(m.created_at)) + (m.edited_at ? " · edited" : "") + "</span>" +
                (mine ? '<button data-editp="' + m.id + '">Edit</button><button class="del" data-delp="' + m.id + '">Delete</button>' : "") +
                "</div>") +
            "</div>";
          prevAuthor = m.author; prevAt = new Date(m.created_at);
        });
        feed.innerHTML = html;
        if (stickBottom || MSGS.length !== lastCount) feed.scrollTop = feed.scrollHeight;
        lastCount = MSGS.length;
        fillMedia(feed);
      }

      async function loadAttachments() {
        var ids = MSGS.map(function (m) { return m.id; });
        if (!ids.length) { ATT = {}; return; }
        var r = await db.from("attachments").select("*").in("message_id", ids).order("sort");
        if (r.error) return;
        ATT = {};
        (r.data || []).forEach(function (a) { (ATT[a.message_id] = ATT[a.message_id] || []).push(a); });
      }

      async function markRead() {
        if (!openId || !staff) return;
        await db.from("thread_reads").upsert(
          [{ thread_id: Number(openId), reader: ME, last_read_at: new Date().toISOString() }],
          { onConflict: "thread_id,reader" });
        UNREAD[openId] = { unread: 0, mentioned: false };
        paintList();
      }

      async function openThread(id, push) {
        openId = String(id);
        editing = null; lastCount = 0; stickBottom = true;
        document.getElementById("app").classList.add("open");
        if (push !== false) location.hash = "t=" + id;
        paintList(); paintFeed();
        var r = await db.from("messages").select("*").eq("thread_id", Number(id)).order("created_at");
        MSGS = r.error ? [] : r.data || [];
        await loadAttachments();
        paintFeed();
        markRead();
      }

      /* Find the thread for a subject, or make it. Used by deep links from the
         pages that hold the record, so a conversation never has to be started
         from here to be attached to the right thing. */
      async function openSubject(kind, id, title) {
        var have = THREADS.filter(function (t) { return t.subject_kind === kind && String(t.subject_id) === String(id); })[0];
        if (have) return openThread(have.id);
        var ins = await db.from("threads")
          .insert([{ event_id: EVENT_ID, subject_kind: kind, subject_id: String(id), title: title || (kind + " " + id) }])
          .select("*");
        if (ins.error || !ins.data || !ins.data.length) { await load();
          var again = THREADS.filter(function (t) { return t.subject_kind === kind && String(t.subject_id) === String(id); })[0];
          return again ? openThread(again.id) : null; }
        THREADS.unshift(ins.data[0]);
        return openThread(ins.data[0].id);
      }

      /* ---------- the tray: files chosen but not yet sent ---------- */
      function trayPaint() {
        var el = document.getElementById("tray");
        el.innerHTML = PEND.map(function (f, i) {
          return '<div class="chip' + (f.error ? " bad" : "") + '" title="' + esc(f.error || f.name) + '">' +
            (f.thumb
              ? (f.kind === "video" ? '<video src="' + f.thumb + '" muted></video>' : '<img src="' + f.thumb + '" alt="" />')
              : '<span class="lbl">' + esc(f.error ? "refused" : f.kind === "voice" ? clock(f.ms) : ext(f.name)) + "</span>") +
            '<button class="kill" type="button" data-kill="' + i + '" aria-label="Remove">&times;</button>' +
            '<span class="bar"><i style="width:' + (f.error ? 0 : f.pct || 0) + '%"></i></span></div>';
        }).join("");
        document.getElementById("send").disabled =
          !PEND.filter(function (f) { return !f.error; }).length && !document.getElementById("say").value.trim();
      }
      function trayHint(msg) {
        document.getElementById("hint").innerHTML = msg
          ? "<b>" + esc(msg) + "</b>"
          : "Enter sends. Shift and Enter makes a new line.";
      }

      async function take(files) {
        var have = PEND.filter(function (f) { return f.kind === "photo"; }).length;
        for (var i = 0; i < files.length; i++) {
          var f = files[i], k = kindOf(f);
          if (k === "photo" && have >= LIMITS.photo) {
            trayHint("Fifty photos is the ceiling on one message. " + (files.length - i) + " were left out.");
            break;
          }
          if (k === "photo") have++;
          var item = { file: f, name: f.name, kind: k, bytes: f.size, pct: 0, thumb: null, ms: null };
          if (k === "photo" || k === "video") item.thumb = URL.createObjectURL(f);
          if (k === "video" || k === "voice") {
            var d = await duration(f);
            if (d) {
              item.ms = Math.round(d * 1000);
              var cap = k === "video" ? LIMITS.videoSec : LIMITS.voiceSec;
              if (d > cap + 1) item.error = "Longer than five minutes. Trim it and try again.";
            }
          }
          PEND.push(item);
          trayPaint();
          if (!item.error) push(item);
        }
        trayPaint();
      }

      var draftKey = null;
      function draft() {
        if (!draftKey) draftKey = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        return draftKey;
      }
      async function push(item) {
        var tok = await token();
        if (!tok) { item.error = "Signed out. Sign in and try again."; return trayPaint(); }
        try {
          var res = await blobUpload("chat/" + ME.replace(/[^a-z0-9]+/g, "-") + "/" + draft() +
            "/" + item.kind + "/" + item.name, item.file, {
              access: "public", // the STORE is private; this flag belongs to the client API
              handleUploadUrl: "/api/upload",
              clientPayload: JSON.stringify({ scope: "chat", kind: item.kind, draftId: draft(), token: tok }),
              onUploadProgress: function (p2) { item.pct = Math.round(p2.percentage || 0); trayPaint(); },
            });
          item.path = res.pathname; item.pct = 100;
        } catch (e) {
          item.error = (e && e.message) || "upload refused";
        }
        trayPaint();
      }

      /* ---------- voice ---------- */
      async function recStartFn() {
        if (!navigator.mediaDevices || !window.MediaRecorder) {
          return trayHint("This browser will not record audio. Attach a file instead.");
        }
        var stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e) { return trayHint("Microphone refused, so there is nothing to record."); }
        recChunks = [];
        var mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].filter(function (t) {
          return window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t);
        })[0];
        rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        rec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
        rec.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); };
        recStart = Date.now();
        rec.start();
        document.getElementById("reclive").style.display = "";
        document.getElementById("pickVoice").classList.add("rec");
        recTimer = setInterval(function () {
          var ms = Date.now() - recStart;
          document.getElementById("recLen").textContent = clock(ms);
          if (ms >= LIMITS.voiceSec * 1000) recKeepFn();
        }, 200);
      }
      function recEnd() {
        clearInterval(recTimer); recTimer = null;
        document.getElementById("reclive").style.display = "none";
        document.getElementById("pickVoice").classList.remove("rec");
        document.getElementById("recLen").textContent = "0:00";
      }
      function recKeepFn() {
        if (!rec || rec.state === "inactive") return recEnd();
        var ms = Date.now() - recStart;
        rec.onstop = (function (prev) {
          return function () {
            prev && prev();
            var blob = new Blob(recChunks, { type: recChunks[0] ? recChunks[0].type : "audio/webm" });
            var name = "voice-" + new Date().toISOString().replace(/[:.]/g, "-") + (blob.type.indexOf("mp4") > -1 ? ".m4a" : ".webm");
            var file = new File([blob], name, { type: blob.type });
            var item = { file: file, name: name, kind: "voice", bytes: file.size, pct: 0, thumb: null, ms: ms };
            PEND.push(item); trayPaint(); push(item);
          };
        })(rec.onstop);
        rec.stop(); rec = null; recEnd();
      }
      function recDropFn() {
        if (rec && rec.state !== "inactive") { recChunks = []; rec.stop(); }
        rec = null; recEnd();
      }

      async function send() {
        var el = document.getElementById("say");
        var text = el.value.trim();
        if (!openId) return;
        var files = PEND.filter(function (f) { return f.path && !f.error; });
        if (!text && !files.length) return;
        if (PEND.filter(function (f) { return !f.path && !f.error; }).length) {
          return trayHint("Still uploading. It sends the moment they finish.");
        }
        var mentions = ROSTER.filter(function (p) { return text.indexOf("@" + p.name) > -1; }).map(function (p) { return p.email; });

        /* A message row must carry a body, so a files-only message gets a zero
           width space that the bubble renders as nothing. Cleaner than making
           body nullable and having every reader guard for it. */
        var payload = text || "\u200b";
        el.value = ""; el.style.height = "auto";
        document.getElementById("send").disabled = true;
        stickBottom = true;
        var r = await db.from("messages").insert([{ thread_id: Number(openId), body: payload, mentions: mentions }]).select("*");
        if (r.error || !r.data || !r.data.length) {
          document.getElementById("hint").innerHTML = "<b>Not sent.</b> " + esc((r.error && r.error.message) || "nothing came back, which is what a permission refusal looks like");
          el.value = text; trayPaint(); return;
        }
        var msg = r.data[0];
        if (files.length) {
          var rows = files.map(function (f, i) {
            return { message_id: msg.id, owner_email: ME, kind: f.kind, path: f.path,
                     filename: f.name, mime: f.file.type || null, bytes: f.bytes,
                     duration_ms: f.ms || null, sort: i };
          });
          var a = await db.from("attachments").insert(rows).select("*");
          ATT[msg.id] = a.error ? [] : a.data || [];
          if (a.error) trayHint("Message sent, but the files did not attach: " + a.error.message);
        }
        PEND.forEach(function (f) { if (f.thumb) URL.revokeObjectURL(f.thumb); });
        PEND = []; draftKey = null; trayPaint();
        if (!files.length) trayHint("");
        MSGS.push(msg); paintFeed(); markRead();
        var t = THREADS.filter(function (x) { return String(x.id) === String(openId); })[0];
        if (t) {
          t.last_at = msg.created_at; t.last_by = ME; t.message_count++;
          t.last_preview = text ? text.slice(0, 140)
            : files.length + (files.length === 1 ? " attachment" : " attachments");
          sortThreads(); paintList();
        }
      }
      function sortThreads() {
        THREADS.sort(function (a, b) { return String(b.last_at).localeCompare(String(a.last_at)); });
      }

      /* Split in two on purpose.
       *
       * boot() is the part that does not change while a tab is open: who you
       * are, whether you are staff, the roster, the profiles. It used to run on
       * every poll, which meant five round trips every four and a half seconds
       * for answers already known, and one of them, ensure_profile, is a write.
       * A tab left open on the field was upserting a profile row roughly
       * nineteen thousand times a day.
       *
       * poll() is the part that does change, and it asks the cheapest question
       * first: the id and edited_at of every message, two columns rather than
       * every body. Only when that fingerprint moves does it fetch the bodies.
       * A thread of five hundred messages was pulling its whole history every
       * four and a half seconds, forever.
       */
      var BOOTED = false;

      async function boot() {
        ME = (await rpc("me")) || "";
        /* First sign in creates the person's profile, so nobody has to be set
           up by hand before their name can appear on anything. Once per tab is
           enough: the row does not evaporate between polls. */
        MY = await rpc("ensure_profile");
        var res = await Promise.allSettled([
          loadPeople(),
          db.from("staff_allowlist").select("email,name,role,primary_email"),
        ]);
        var n = res[1].status === "fulfilled" ? res[1].value : null;
        if (n && !n.error) {
          (n.data || []).forEach(function (x) { if (x.name) NAMES[String(x.email).toLowerCase()] = x.name; });
          var seen = {};
          ROSTER = (n.data || []).filter(function (x) {
            if (!x.name || seen[x.name]) return false;
            seen[x.name] = 1; return true;
          }).map(function (x) { return { name: x.name, email: x.primary_email || x.email, role: x.role || "" }; });
        }
        document.getElementById("meTxt").textContent = nameOf(ME);
        var meAv = document.getElementById("meAv");
        if (meAv) { meAv.innerHTML = avatar(ME); fillMedia(document.querySelector(".brandrow")); }
      }

      async function load() {
        if (!db) return;
        var tok = await token();
        /* Checked once per tab. While it is false we keep asking, so signing in
           on another tab takes effect on the next poll, not on a reload. */
        if (!staff) staff = !!tok && (await rpc("is_staff")) === true;
        document.getElementById("me").classList.toggle("on", staff);
        if (!staff) {
          document.getElementById("meTxt").textContent = "Not signed in";
          document.getElementById("list").innerHTML =
            '<div class="lock">Team chat is staff only. Sign in at the <a href="/console/">console</a> on this device and it unlocks here.</div>';
          document.getElementById("feed").innerHTML =
            '<div class="blank"><b>Locked</b><p>This is the team conversation, so it needs a signed in staff account.</p></div>';
          return;
        }
        if (!BOOTED) { await boot(); BOOTED = true; }

        /* Threads, unread and the fingerprint share nothing, so they go together. */
        var out = await Promise.allSettled([
          db.from("threads").select("*").order("last_at", { ascending: false }),
          rpc("my_unread"),
          openId
            ? db.from("messages").select("id,edited_at").eq("thread_id", Number(openId)).order("created_at")
            : Promise.resolve(null),
        ]);

        if (out[0].status === "fulfilled" && out[0].value && !out[0].value.error) THREADS = out[0].value.data || [];

        UNREAD = {};
        if (out[1].status === "fulfilled") {
          var u = out[1].value;
          (Array.isArray(u) ? u : []).forEach(function (x) { UNREAD[x.thread_id] = { unread: x.unread, mentioned: x.mentioned }; });
        }
        if (openId) UNREAD[openId] = { unread: 0, mentioned: false };
        paintList();

        if (!openId) { paintFeed(); return; }

        var fp = out[2].status === "fulfilled" ? out[2].value : null;
        if (!fp || fp.error) return;
        var sig = (fp.data || []).map(function (m) { return m.id + ":" + m.edited_at; }).join(",");
        var have = MSGS.map(function (m) { return m.id + ":" + m.edited_at; }).join(",");
        if (sig === have || editing) return;

        /* Only now, and only because something actually moved. */
        var r = await db.from("messages").select("*").eq("thread_id", Number(openId)).order("created_at");
        if (r.error) return;
        MSGS = r.data || [];
        await loadAttachments();
        paintFeed();
        markRead();
      }

      /* ---------- lightbox ---------- */
      function lbOpen(id) {
        var all = [];
        MSGS.forEach(function (m) {
          (ATT[m.id] || []).forEach(function (a) { if (a.kind === "photo" || a.kind === "video") all.push(a); });
        });
        LB = all;
        lbAt = Math.max(0, all.findIndex(function (a) { return String(a.id) === String(id); }));
        lbPaint();
        document.getElementById("lb").classList.add("on");
      }
      async function lbPaint() {
        var a = LB[lbAt];
        if (!a) return;
        document.getElementById("lbName").textContent =
          (a.filename || "") + (LB.length > 1 ? "   " + (lbAt + 1) + " of " + LB.length : "");
        var box = document.getElementById("lbBody");
        box.innerHTML = a.kind === "video"
          ? '<video data-path="' + esc(a.path) + '" controls autoplay playsinline></video>'
          : '<img data-path="' + esc(a.path) + '" alt="' + esc(a.filename || "") + '" />';
        var get = document.getElementById("lbGet");
        get.setAttribute("data-path", a.path);
        get.setAttribute("download", a.filename || "file");
        document.getElementById("lbP").style.display = LB.length > 1 ? "" : "none";
        document.getElementById("lbN").style.display = LB.length > 1 ? "" : "none";
        await fillMedia(document.getElementById("lb"));
      }
      function lbStep(n) { if (!LB.length) return; lbAt = (lbAt + n + LB.length) % LB.length; lbPaint(); }
      function lbClose() { document.getElementById("lb").classList.remove("on"); document.getElementById("lbBody").innerHTML = ""; }

      /* ---------- profile ---------- */
      async function loadPeople() {
        var r = await db.from("profiles").select("*");
        if (r.error) return;
        PEOPLE = {};
        (r.data || []).forEach(function (x) { PEOPLE[String(x.email).toLowerCase()] = x; });
        MY = PEOPLE[ME.toLowerCase()] || MY;
      }
      function profPaint() {
        if (!MY) return;
        document.getElementById("pAv").innerHTML = avatar(ME, "big");
        document.getElementById("pName").textContent = MY.full_name || nameOf(ME);
        document.getElementById("pMail").textContent = ME;
        document.getElementById("pFull").value = MY.full_name || "";
        document.getElementById("pTitle").value = MY.title || MY.role || "";
        document.getElementById("pOrg").value = MY.org || "";
        document.getElementById("pPhone").value = MY.phone || "";
        document.getElementById("pBio").value = MY.bio || "";
        fillMedia(document.getElementById("prof"));
      }
      /* "Saved to the profile of the employee sending it": every attachment
         carries owner_email, so this is that list, read back. */
      async function profMine() {
        var box = document.getElementById("pMine");
        var r = await db.from("attachments").select("*").eq("owner_email", ME)
          .order("created_at", { ascending: false }).limit(24);
        var set = r.error ? [] : r.data || [];
        var shots = set.filter(function (a) { return a.kind === "photo" || a.kind === "video"; });
        box.innerHTML = "<h3>What you have shared</h3>" +
          (set.length
            ? '<div class="g">' + shots.slice(0, 12).map(function (a) {
                return '<figure data-lbo="' + a.id + '"><img data-path="' + esc(a.path) + '" alt="" loading="lazy" /></figure>';
              }).join("") + "</div>" +
              '<p style="margin-top:9px;font-size:12.5px;color:var(--mute)">' +
              set.length + (set.length === 1 ? " file" : " files") + " in the last two dozen, " +
              size(set.reduce(function (n, a) { return n + Number(a.bytes || 0); }, 0)) + " in all.</p>"
            : '<p style="font-size:13px;color:var(--mute)">Nothing yet. Anything you send here lands in this list.</p>');
        await fillMedia(box);
      }
      async function profSave() {
        var patch = {
          full_name: document.getElementById("pFull").value.trim() || null,
          title: document.getElementById("pTitle").value.trim() || null,
          org: document.getElementById("pOrg").value.trim() || null,
          phone: document.getElementById("pPhone").value.trim() || null,
          bio: document.getElementById("pBio").value.trim() || null,
          updated_at: new Date().toISOString(),
        };
        var btn = document.getElementById("pSave");
        btn.textContent = "Saving";
        var r = await db.from("profiles").update(patch).eq("email", ME).select("*");
        if (r.error || !r.data || !r.data.length) {
          btn.textContent = "Not saved";
          return;
        }
        MY = r.data[0]; PEOPLE[ME.toLowerCase()] = MY;
        btn.textContent = "Saved";
        setTimeout(function () { btn.textContent = "Save profile"; }, 1400);
        profPaint(); paintFeed();
        var mine = document.getElementById("meAv");
        if (mine) mine.innerHTML = avatar(ME);
        fillMedia(document.querySelector(".brandrow"));
      }
      async function avatarUp(file) {
        var note = document.getElementById("pAvNote");
        var tok = await token();
        if (!tok) { note.textContent = "signed out"; return; }
        note.textContent = "uploading";
        try {
          var res = await blobUpload("avatars/" + ME.replace(/[^a-z0-9]+/g, "-") + "/" + file.name, file, {
            access: "public", handleUploadUrl: "/api/upload",
            clientPayload: JSON.stringify({ scope: "avatar", token: tok }),
          });
          var r = await db.from("profiles").update({ avatar_path: res.pathname, updated_at: new Date().toISOString() })
            .eq("email", ME).select("*");
          if (r.error || !r.data || !r.data.length) { note.textContent = "the picture uploaded but the profile did not save"; return; }
          MY = r.data[0]; PEOPLE[ME.toLowerCase()] = MY;
          note.textContent = "";
          profPaint(); paintFeed();
          var mine = document.getElementById("meAv");
          if (mine) mine.innerHTML = avatar(ME);
          fillMedia(document.querySelector(".brandrow"));
        } catch (e) { note.textContent = (e && e.message) || "upload refused"; }
      }

      /* ---------- mentions ---------- */
      function mentionScan() {
        var el = document.getElementById("say");
        var upto = el.value.slice(0, el.selectionStart);
        var m = /@([\w' ]{0,24})$/.exec(upto);
        var box = document.getElementById("mentions");
        if (!m) { mentionOpen = false; box.classList.remove("on"); return; }
        var q = m[1].toLowerCase();
        mentionHits = ROSTER.filter(function (p) { return p.name.toLowerCase().indexOf(q) === 0; });
        if (!mentionHits.length) { mentionOpen = false; box.classList.remove("on"); return; }
        mentionAt = el.selectionStart - m[0].length;
        mentionOpen = true; mentionPick = Math.min(mentionPick, mentionHits.length - 1);
        box.classList.add("on");
        box.innerHTML = mentionHits.map(function (p, i) {
          return '<div class="' + (i === mentionPick ? "sel" : "") + '" data-mi="' + i + '">' + esc(p.name) +
            (p.role ? "<small>" + esc(p.role) + "</small>" : "") + "</div>";
        }).join("");
      }
      function mentionTake(i) {
        var el = document.getElementById("say"), p = mentionHits[i];
        if (!p) return;
        el.value = el.value.slice(0, mentionAt) + "@" + p.name + " " + el.value.slice(el.selectionStart);
        el.focus();
        var pos = mentionAt + p.name.length + 2;
        el.setSelectionRange(pos, pos);
        mentionOpen = false; mentionPick = 0;
        document.getElementById("mentions").classList.remove("on");
        document.getElementById("send").disabled = !el.value.trim();
      }

      /* ---------- events ---------- */
      document.getElementById("say").addEventListener("input", function (e) {
        e.target.style.height = "auto";
        e.target.style.height = Math.min(168, e.target.scrollHeight) + "px";
        document.getElementById("send").disabled = !e.target.value.trim();
        mentionScan();
      });
      document.getElementById("say").addEventListener("keydown", function (e) {
        if (mentionOpen) {
          if (e.key === "ArrowDown") { e.preventDefault(); mentionPick = (mentionPick + 1) % mentionHits.length; return mentionScan(); }
          if (e.key === "ArrowUp") { e.preventDefault(); mentionPick = (mentionPick - 1 + mentionHits.length) % mentionHits.length; return mentionScan(); }
          if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return mentionTake(mentionPick); }
          if (e.key === "Escape") { mentionOpen = false; return document.getElementById("mentions").classList.remove("on"); }
        }
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      });
      document.getElementById("send").addEventListener("click", send);
      document.getElementById("pickPhoto").addEventListener("click", function () { document.getElementById("fPhoto").click(); });
      document.getElementById("pickDoc").addEventListener("click", function () { document.getElementById("fDoc").click(); });
      document.getElementById("pickVoice").addEventListener("click", function () { rec ? recKeepFn() : recStartFn(); });
      document.getElementById("recKeep").addEventListener("click", recKeepFn);
      document.getElementById("recDrop").addEventListener("click", recDropFn);
      ["fPhoto", "fDoc"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", function (e) {
          if (e.target.files && e.target.files.length) take(e.target.files);
          e.target.value = "";
        });
      });
      document.getElementById("fAv").addEventListener("change", function (e) {
        if (e.target.files && e.target.files[0]) avatarUp(e.target.files[0]);
        e.target.value = "";
      });
      document.getElementById("pPick").addEventListener("click", function () { document.getElementById("fAv").click(); });
      document.getElementById("pSave").addEventListener("click", profSave);
      document.getElementById("lbX").addEventListener("click", lbClose);
      document.getElementById("lbP").addEventListener("click", function () { lbStep(-1); });
      document.getElementById("lbN").addEventListener("click", function () { lbStep(1); });

      /* Paste a screenshot straight into the composer, the way every tool that
         gets used all day lets you. */
      document.getElementById("say").addEventListener("paste", function (e) {
        var items = (e.clipboardData || {}).items || [];
        var files = [];
        for (var i = 0; i < items.length; i++) {
          if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
        }
        if (files.length) { e.preventDefault(); take(files); }
      });
      /* Drop files anywhere on the conversation. */
      ["dragover", "drop"].forEach(function (ev) {
        document.getElementById("main").addEventListener(ev, function (e) {
          e.preventDefault();
          if (ev === "drop" && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length && openId) {
            take(e.dataTransfer.files);
          }
        });
      });
      document.getElementById("find").addEventListener("input", paintList);
      document.getElementById("back").addEventListener("click", function () {
        document.getElementById("app").classList.remove("open");
        openId = null; location.hash = ""; paintList(); paintFeed();
      });
      document.getElementById("feed").addEventListener("scroll", function (e) {
        stickBottom = e.target.scrollHeight - e.target.scrollTop - e.target.clientHeight < 90;
      });

      document.addEventListener("click", async function (e) {
        var kill = e.target.closest("[data-kill]");
        if (kill) {
          var ki = Number(kill.getAttribute("data-kill"));
          if (PEND[ki] && PEND[ki].thumb) URL.revokeObjectURL(PEND[ki].thumb);
          PEND.splice(ki, 1); return trayPaint();
        }
        var lbf = e.target.closest("[data-lb]");
        if (lbf) return lbOpen(lbf.getAttribute("data-lb"));
        var lbo = e.target.closest("[data-lbo]");
        if (lbo) {
          /* From the profile drawer the file may not be in the open thread, so
             the strip is just that one file rather than the conversation. */
          var r0 = await db.from("attachments").select("*").eq("id", lbo.getAttribute("data-lbo"));
          if (!r0.error && r0.data && r0.data.length) { LB = r0.data; lbAt = 0; lbPaint();
            document.getElementById("lb").classList.add("on"); }
          return;
        }
        var play = e.target.closest("[data-play]");
        if (play) {
          var pid = play.getAttribute("data-play");
          var att = null;
          Object.keys(ATT).forEach(function (k) {
            (ATT[k] || []).forEach(function (a) { if (String(a.id) === String(pid)) att = a; });
          });
          if (!att) return;
          await signPaths([att.path]);
          var hit = SIGNED[att.path];
          if (!hit) return;
          if (window.__voice) { window.__voice.pause(); }
          window.__voice = new Audio(hit.url);
          play.innerHTML = "&#9208;";
          window.__voice.onended = function () { play.innerHTML = "&#9654;"; };
          window.__voice.play().catch(function () { play.innerHTML = "&#9654;"; });
          return;
        }
        if (e.target.closest("#meAv")) { document.getElementById("prof").classList.add("on"); profPaint(); profMine(); return; }
        if (e.target.closest("[data-pclose]")) { document.getElementById("prof").classList.remove("on"); return; }
        var mi = e.target.closest("[data-mi]");
        if (mi) return mentionTake(Number(mi.getAttribute("data-mi")));
        var th = e.target.closest("[data-t]");
        if (th) return openThread(th.getAttribute("data-t"));
        var ed = e.target.closest("[data-editp]");
        if (ed) { editing = ed.getAttribute("data-editp"); return paintFeed(); }
        if (e.target.closest("[data-cancel]")) { editing = null; return paintFeed(); }
        var sv = e.target.closest("[data-savep]");
        if (sv) {
          var id = sv.getAttribute("data-savep");
          var ta = document.querySelector('[data-edit="' + id + '"]');
          var v = (ta.value || "").trim();
          if (!v) return;
          var mentions = ROSTER.filter(function (p) { return v.indexOf("@" + p.name) > -1; }).map(function (p) { return p.email; });
          var r = await db.from("messages").update({ body: v, mentions: mentions }).eq("id", id).select("*");
          editing = null;
          if (!r.error && r.data && r.data.length) MSGS = MSGS.map(function (m) { return String(m.id) === String(id) ? r.data[0] : m; });
          return paintFeed();
        }
        var dl = e.target.closest("[data-delp]");
        if (dl) {
          var did = dl.getAttribute("data-delp");
          if (!confirm("Delete this message? It goes for everyone.")) return;
          var d = await db.from("messages").delete().eq("id", did).select("id");
          if (!d.error) { MSGS = MSGS.filter(function (m) { return String(m.id) !== String(did); }); paintFeed(); }
          return;
        }
        if (!e.target.closest("#mentions") && !e.target.closest("#say")) {
          mentionOpen = false; document.getElementById("mentions").classList.remove("on");
        }
      });

      async function fromHash() {
        var h = location.hash.slice(1);
        if (!h) return;
        var t = /^t=(\d+)$/.exec(h);
        if (t) return openThread(t[1], false);
        /* #s=<kind>:<id>:<title>, the form the other pages link with */
        var s = /^s=([a-z]+):([^:]+):?(.*)$/.exec(h);
        if (s) return openSubject(s[1], decodeURIComponent(s[2]), decodeURIComponent(s[3] || ""));
      }
      document.addEventListener("keydown", function (e) {
        if (!document.getElementById("lb").classList.contains("on")) return;
        if (e.key === "Escape") lbClose();
        if (e.key === "ArrowLeft") lbStep(-1);
        if (e.key === "ArrowRight") lbStep(1);
      });
      window.addEventListener("hashchange", fromHash);

      /* ---------- installed app ---------- */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/chat/sw.js", { scope: "/chat/" }).catch(function () {});
        });
      }
      var deferred = null;
      var btn = document.getElementById("install");
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault(); deferred = e;
        if (!localStorage.getItem("ranchChatInstallDismissed")) btn.classList.add("on");
      });
      btn.addEventListener("click", async function () {
        btn.classList.remove("on");
        localStorage.setItem("ranchChatInstallDismissed", "1");
        if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; }
      });
      window.addEventListener("appinstalled", function () { btn.classList.remove("on"); });

      /* The dock badge is the whole point of installing it: unread count on the
         icon without opening anything. Silently unavailable on iOS unless the
         app was added to the home screen, so it is never relied on. */
      function badge(n) {
        try {
          if (!navigator.setAppBadge) return;
          n ? navigator.setAppBadge(n) : navigator.clearAppBadge();
        } catch (e) {}
      }

      (async function () {
        await load();
        if (staff) await fromHash();
        /* Poll faster while the window has focus, slower when it does not, so
           a phone left open on the field is not hammering the API all day. */
        var tick = 0;
        setInterval(function () {
          if (document.hidden) { tick = (tick + 1) % 6; if (tick) return; }
          load();
        }, 4500);
      })();
    </script>
